
name: Daily CVE Download

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Brussels'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download CVEs
        working-directory: latest-month-cves
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python fetch_cves.py

      - name: Commit reports to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest-month-cves/reports/

          if ! git diff --cached --quiet; then
            git commit -m "Update monthly CVE reports"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-month-cves
          path: latest-month-cves/reports/*.csv
          retention-days: 30
