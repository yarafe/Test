name: Daily CVE Download

on:
  schedule:
    - cron: '17 8 * * *'
      timezone: 'Europe/Brussels'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download CVEs published this month
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python monthly-cve-watch/fetch_cves.py
      - name: Save CSV to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: latest-month-cves
          path: reports/*.csv
          retention-days: 30
